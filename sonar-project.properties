sonar.projectKey=cmiic_dependabot-automation
sonar.organization=cmiic
sonar.exclusions=dist/**

# Coverage comes from `npm run test:coverage`, which sq.yml runs before the
# scan. Without it Sonar sees no coverage data at all and scores every changed
# line as uncovered, which fails the new_coverage condition on any pull request
# that touches code -- the tests themselves were never the problem.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The entrypoints are top-level scripts: they read the environment and run on
# import, so nothing can require them without executing a workflow step. They
# stay analysed for issues, just not measured for coverage. The logic worth
# testing lives in src/lib, which the suite covers directly.
sonar.coverage.exclusions=src/entrypoints/**
# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=dependabot-automation
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8