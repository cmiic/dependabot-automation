sonar.projectKey=cmiic_dependabot-automation
sonar.organization=cmiic
sonar.exclusions=dist/**

# Cron intentionally awaits each candidate in order: review/merge outcomes
# decide whether the next candidate may advance. Parallelising this loop could
# approve or merge several PRs before pipelineBusy stops the queue. Reads and
# mutations within a candidate also depend on the preceding API responses.
# Keep all other rules enabled for this file, and S9382 enabled elsewhere.
sonar.issue.ignore.multicriteria=cronSequentialAwait
sonar.issue.ignore.multicriteria.cronSequentialAwait.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.cronSequentialAwait.resourceKey=src/entrypoints/process-cron.ts

# Coverage comes from `npm run test:coverage`, which sq.yml runs before the
# scan. Without it Sonar sees no coverage data at all and scores every changed
# line as uncovered, which fails the new_coverage condition on any pull request
# that touches code -- the tests themselves were never the problem.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The entrypoints are top-level scripts: they read the environment and run on
# import, so nothing can require them without executing a workflow step. They
# stay analysed for issues, just not measured for coverage. The logic worth
# testing lives in src/lib, which the suite covers directly.
#
# tests/** is here because sonar.sources is left at its default, so the suite is
# analysed as ordinary source. That is deliberate -- issues in test code are
# worth seeing -- but Node's lcov reporter omits test files, so without this
# line every new line of test code counts as uncovered production code. Adding
# 123 lines of tests dropped new_coverage to 52.9% on PR #55 while the code
# under test stayed above 90%.
sonar.coverage.exclusions=src/entrypoints/**,tests/**
# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=dependabot-automation
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
