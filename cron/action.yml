name: Dependabot Automerge (Cron)
description: Re-check aged Dependabot PRs with approval signals and merge or enable auto-merge after quarantine.

inputs:
  github-token:
    description: GitHub token with contents:write, pull-requests:write, and issues:read permissions.
    required: true
  quarantine-days:
    description: Minimum approval age before auto-merge is enabled.
    required: false
    default: "3"
  merge-method:
    description: Auto-merge method. Supported values are merge, squash, and rebase.
    required: false
    default: squash

outputs:
  processed-count:
    description: Number of open Dependabot PRs inspected.
    value: ${{ steps.run.outputs.processed-count }}
  quarantine-passed-count:
    description: Number of inspected PRs old enough to merge or enable auto-merge.
    value: ${{ steps.run.outputs.quarantine-passed-count }}
  merged-count:
    description: Number of PRs merged in this run.
    value: ${{ steps.run.outputs.merged-count }}
  automerge-enabled-count:
    description: Number of PRs where auto-merge was enabled because direct merge was not yet possible.
    value: ${{ steps.run.outputs.automerge-enabled-count }}
  already-enabled-count:
    description: Number of PRs that already had auto-merge enabled.
    value: ${{ steps.run.outputs.already-enabled-count }}
  failed-count:
    description: Number of PRs for which an unexpected error occurred.
    value: ${{ steps.run.outputs.failed-count }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24

    - id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        QUARANTINE_DAYS: ${{ inputs.quarantine-days }}
        MERGE_METHOD: ${{ inputs.merge-method }}
      run: node "$GITHUB_ACTION_PATH/../dist/process-cron.js"
