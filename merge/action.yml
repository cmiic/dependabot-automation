name: Dependabot Automerge (PR)
description: Evaluate a Dependabot pull request and write an approval signal for the cron enforcer.

inputs:
  github-token:
    description: GitHub token with contents:write, pull-requests:write, and issues:write permissions.
    required: true
  quarantine-days:
    description: Minimum approval age before the cron action may enable auto-merge.
    required: false
    default: "3"
  allowed-ecosystems:
    description: Comma-separated package ecosystems allowed for auto-merge. Use the values returned by dependabot/fetch-metadata (e.g. github_actions, not the dependabot.yml form github-actions).
    required: false
    default: github_actions,npm_and_yarn,devcontainers,docker,uv,pip
  skip-commit-verification:
    description: Forwarded to dependabot/fetch-metadata. Set to true only if you intentionally accept unsigned or non-Dependabot commits on bot PRs.
    required: false
    default: "false"
  trusted-action-owners:
    description: Comma-separated GitHub org/user names trusted for github_actions auto-merge. Use * to trust all owners.
    required: false
    default: actions,github,dependabot

outputs:
  candidate:
    description: Whether the PR is eligible for auto-merge after quarantine.
    value: ${{ steps.result.outputs.candidate }}
  quarantine-passed:
    description: Whether the PR has passed the quarantine window.
    value: ${{ steps.result.outputs.quarantine-passed }}
  automerge-enabled:
    description: Whether auto-merge is already enabled on the pull request.
    value: ${{ steps.result.outputs.automerge-enabled }}
  reason:
    description: High-level result of the evaluation.
    value: ${{ steps.result.outputs.reason }}
  package-ecosystem:
    description: Dependabot package ecosystem from dependabot/fetch-metadata.
    value: ${{ steps.result.outputs.package-ecosystem }}
  update-type:
    description: Dependabot update type from dependabot/fetch-metadata.
    value: ${{ steps.result.outputs.update-type }}
  age-days:
    description: Integer approval age in days for the current head SHA.
    value: ${{ steps.result.outputs.age-days }}
  dependency-file-status:
    description: Outcome of the dependency file policy check.
    value: ${{ steps.result.outputs.dependency-file-status }}
  lockfile-status:
    description: Legacy alias for dependency-file-status.
    value: ${{ steps.result.outputs.lockfile-status }}

runs:
  using: composite
  steps:
    - id: guard
      shell: bash
      run: |
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "candidate=false" >> "$GITHUB_OUTPUT"
          echo "quarantine-passed=false" >> "$GITHUB_OUTPUT"
          echo "automerge-enabled=false" >> "$GITHUB_OUTPUT"
          echo "reason=not-pull-request" >> "$GITHUB_OUTPUT"
          echo "package-ecosystem=" >> "$GITHUB_OUTPUT"
          echo "update-type=" >> "$GITHUB_OUTPUT"
          echo "age-days=0" >> "$GITHUB_OUTPUT"
          echo "dependency-file-status=skipped" >> "$GITHUB_OUTPUT"
          echo "lockfile-status=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "${{ github.event.pull_request.user.login }}" != "dependabot[bot]" ]; then
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "candidate=false" >> "$GITHUB_OUTPUT"
          echo "quarantine-passed=false" >> "$GITHUB_OUTPUT"
          echo "automerge-enabled=false" >> "$GITHUB_OUTPUT"
          echo "reason=not-dependabot" >> "$GITHUB_OUTPUT"
          echo "package-ecosystem=" >> "$GITHUB_OUTPUT"
          echo "update-type=" >> "$GITHUB_OUTPUT"
          echo "age-days=0" >> "$GITHUB_OUTPUT"
          echo "dependency-file-status=skipped" >> "$GITHUB_OUTPUT"
          echo "lockfile-status=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "run=true" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      if: steps.guard.outputs.run == 'true'
      with:
        fetch-depth: 1
        ref: ${{ github.event.pull_request.head.sha }}

    - if: steps.guard.outputs.run == 'true'
      shell: bash
      run: git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      if: steps.guard.outputs.run == 'true'
      with:
        node-version: 24

    - id: metadata
      if: steps.guard.outputs.run == 'true'
      uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      with:
        github-token: ${{ inputs.github-token }}
        skip-commit-verification: ${{ inputs.skip-commit-verification }}

    - id: evaluate
      if: steps.guard.outputs.run == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        QUARANTINE_DAYS: ${{ inputs.quarantine-days }}
        ALLOWED_ECOSYSTEMS: ${{ inputs.allowed-ecosystems }}
        METADATA_PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        METADATA_UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        METADATA_DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        METADATA_UPDATED_DEPENDENCIES_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        TRUSTED_ACTION_OWNERS: ${{ inputs.trusted-action-owners }}
      run: node "$GITHUB_ACTION_PATH/../dist/evaluate-pull-request.js"

    - id: result
      shell: bash
      env:
        GUARD_CANDIDATE: ${{ steps.guard.outputs.candidate }}
        GUARD_QUARANTINE_PASSED: ${{ steps.guard.outputs.quarantine-passed }}
        GUARD_AUTOMERGE_ENABLED: ${{ steps.guard.outputs.automerge-enabled }}
        GUARD_REASON: ${{ steps.guard.outputs.reason }}
        GUARD_PACKAGE_ECOSYSTEM: ${{ steps.guard.outputs.package-ecosystem }}
        GUARD_UPDATE_TYPE: ${{ steps.guard.outputs.update-type }}
        GUARD_AGE_DAYS: ${{ steps.guard.outputs.age-days }}
        GUARD_DEPENDENCY_FILE_STATUS: ${{ steps.guard.outputs.dependency-file-status }}
        GUARD_LOCKFILE_STATUS: ${{ steps.guard.outputs.lockfile-status }}
        EVALUATE_CANDIDATE: ${{ steps.evaluate.outputs.candidate }}
        EVALUATE_QUARANTINE_PASSED: ${{ steps.evaluate.outputs.quarantine-passed }}
        EVALUATE_AUTOMERGE_ENABLED: ${{ steps.evaluate.outputs.automerge-enabled }}
        EVALUATE_REASON: ${{ steps.evaluate.outputs.reason }}
        EVALUATE_PACKAGE_ECOSYSTEM: ${{ steps.evaluate.outputs.package-ecosystem }}
        EVALUATE_UPDATE_TYPE: ${{ steps.evaluate.outputs.update-type }}
        EVALUATE_AGE_DAYS: ${{ steps.evaluate.outputs.age-days }}
        EVALUATE_DEPENDENCY_FILE_STATUS: ${{ steps.evaluate.outputs.dependency-file-status }}
        EVALUATE_LOCKFILE_STATUS: ${{ steps.evaluate.outputs.lockfile-status }}
      run: |
        pick() {
          name="$1"
          evaluated="$2"
          guarded="$3"
          if [ -n "$evaluated" ]; then
            echo "$name=$evaluated" >> "$GITHUB_OUTPUT"
          else
            echo "$name=$guarded" >> "$GITHUB_OUTPUT"
          fi
        }

        pick candidate "$EVALUATE_CANDIDATE" "$GUARD_CANDIDATE"
        pick quarantine-passed "$EVALUATE_QUARANTINE_PASSED" "$GUARD_QUARANTINE_PASSED"
        pick automerge-enabled "$EVALUATE_AUTOMERGE_ENABLED" "$GUARD_AUTOMERGE_ENABLED"
        pick reason "$EVALUATE_REASON" "$GUARD_REASON"
        pick package-ecosystem "$EVALUATE_PACKAGE_ECOSYSTEM" "$GUARD_PACKAGE_ECOSYSTEM"
        pick update-type "$EVALUATE_UPDATE_TYPE" "$GUARD_UPDATE_TYPE"
        pick age-days "$EVALUATE_AGE_DAYS" "$GUARD_AGE_DAYS"
        pick dependency-file-status "$EVALUATE_DEPENDENCY_FILE_STATUS" "$GUARD_DEPENDENCY_FILE_STATUS"
        pick lockfile-status "$EVALUATE_LOCKFILE_STATUS" "$GUARD_LOCKFILE_STATUS"
