name: Feature request
description: Suggest an improvement or new capability
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or pain point are you running into?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should the action do instead? If it needs new inputs or outputs, sketch them.
    validations:
      required: true
  - type: textarea
    id: policy
    attributes:
      label: Policy implications
      description: This project deliberately errs on the side of manual review. Does your proposal widen what gets auto-merged, and if so, why is that safe?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you have tried or considered.
