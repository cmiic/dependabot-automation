name: Dependabot Auto-merge (Cron)

on:
  schedule:
    # 20 minutes after the dependabot.yml update window (21:10), so a PR
    # whose quarantine has passed merges the same evening
    - cron: '30 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: cmiic/dependabot-automation/cron@6da55a5ce4f786ac1ec1c84b997b713ce28178c2 # 2.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          quarantine-days: "1"
