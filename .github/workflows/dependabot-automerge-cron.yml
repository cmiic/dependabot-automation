name: Dependabot Auto-merge (Cron)

on:
  schedule:
    # 20 minutes after the dependabot.yml update window (21:10), so a PR
    # whose quarantine has passed merges the same evening
    - cron: '30 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: cmiic/dependabot-automation/cron@0f69e7d97e0c42d5fe1b5f3a3726b732415b7e29 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          quarantine-days: "1"
