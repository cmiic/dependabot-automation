name: Dependabot Auto-merge (Cron)

on:
  schedule:
    # 20 minutes after the dependabot.yml update window (21:10), so a PR
    # whose quarantine has passed merges the same evening
    - cron: '30 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: cmiic/dependabot-automation/cron@4dec29fb315c0837e6e039fc7e8ce2c04e51042e # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          quarantine-days: "1"
