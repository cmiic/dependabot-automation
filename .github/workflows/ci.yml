name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint:js

      - name: markdownlint
        run: npm run lint:md

      # Scope is the runtime dependency closure -- Trivy's default, kept on
      # purpose. What ships is the committed dist/ bundle, so only runtime code
      # carries a distribution obligation; eslint, typescript and esbuild never
      # reach a consumer. That closure is a single package today only because
      # `toml` happens to have no dependencies of its own: a runtime dep that
      # brings a tree with it is covered transitively, all the way down.
      # Resist widening this with TRIVY_INCLUDE_DEV_DEPS, which pulls in all 203
      # locked packages and lets a copyleft build tool fail CI over code nobody
      # receives. Licences come from package-lock.json's per-package metadata,
      # so the step needs neither node_modules nor a `license` field in
      # package.json.
      - name: Trivy license scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          # Trivy maps its licence categories onto severities: forbidden ->
          # CRITICAL, restricted (GPL and friends) -> HIGH. Gating on those two
          # fails the job on an incompatible licence without listing the
          # permissive ones that make up the rest of the tree.
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: "true"

      # Static analysis of the workflows and composite actions themselves.
      # Suppressions live in .github/zizmor.yml, each with a reason.
      - name: zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Pinned rather than the action's `latest` default, so a new zizmor
          # release cannot turn this gate red on its own schedule. Dependabot
          # does not track this input -- bump it by hand.
          version: 1.29.0
          # Uploading SARIF to the security tab would need security-events:
          # write; keep this workflow at contents: read and surface findings as
          # PR annotations instead. The two options are mutually exclusive.
          advanced-security: false
          annotations: true

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: Verify bundled runtime
        run: npm run check:dist
