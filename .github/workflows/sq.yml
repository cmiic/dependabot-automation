name: SonarQube Cloud

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    name: SonarQube
    # SONAR_TOKEN is not reachable from either kind of pull request that cannot
    # see repository secrets: forks get none, and Dependabot reads the separate
    # Dependabot secrets store, which is empty here. In both cases the token
    # resolves to "" and the scan fails on authentication. Skipping beats
    # failing -- main is not branch-protected so it would not have blocked a
    # merge, but it would have put a red X on every Dependabot PR, which is the
    # traffic this repository exists to handle.
    if: secrets.SONAR_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # shallow clones weaken blame-based analysis
          # The scanner only reads the history fetched above; it makes no
          # further git network calls, so the checkout credentials can go.
          persist-credentials: false
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
