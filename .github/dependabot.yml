version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /cron
      - /merge
    schedule:
      interval: daily
      time: "21:10"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
